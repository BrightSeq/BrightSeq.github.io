<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
<clipPath id="c"><circle cx="256" cy="256" r="256"/></clipPath>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffd48a" stop-opacity="0.95"/><stop offset="0.4" stop-color="#e29a45" stop-opacity="0.5"/><stop offset="1" stop-color="#e29a45" stop-opacity="0"/></radialGradient>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b4a41"/><stop offset="1" stop-color="#1b2d28"/></linearGradient>
</defs>
<g clip-path="url(#c)">
<rect width="512" height="512" fill="url(#bg)"/>
<!-- stair mass descending from upper right to the lower left -->
