<rect x="104" y="316" width="52" height="68" rx="14" fill="#ffd991"/>
<rect x="104" y="316" width="52" height="14" rx="7" fill="#b47b36"/>
<rect x="104" y="372" width="52" height="12" rx="6" fill="#b47b36"/>
</g>
